name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # ruff 0.15.x strips parens from `except (A, B):` when target-version is
      # py314, producing invalid Python syntax. Pin below 0.15 until the
      # upstream regression is fixed.
      - run: pip install "ruff<0.15"
      - run: ruff check custom_components/sunsynk/
      - run: ruff format --check custom_components/sunsynk/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: |
          pip install -e .
          pip install pytest-homeassistant-custom-component
      - run: pytest tests/ -v

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: "home-assistant/actions/hassfest@master"
